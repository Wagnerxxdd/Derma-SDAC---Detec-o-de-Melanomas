name: deteccao_de_melanomas
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  intl: ^0.19.0
  image_picker: ^0.8.7+6
  image: ^4.1.7
  tflite_flutter:
    path: third_party/tflite_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.3.3
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/logo.jpeg
    - assets/camera.jpeg
    - assets/aleksandro.jpg
    - assets/kevin.jpeg
    - assets/prof.robson.jpg
    - assets/wagner.jpg
    - assets/wilton.jpg
    - assets/models/modeloMLP.tflite
    - assets/models/config_frontend.json
